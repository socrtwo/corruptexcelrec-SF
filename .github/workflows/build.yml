name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    name: Native (Windows / VB.NET)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore "Excel Recovery.sln"
        continue-on-error: true

      - name: Build solution
        run: msbuild "Excel Recovery.sln" /p:Configuration=Release /p:Platform="Any CPU" /m
        continue-on-error: true

      - name: Upload native build
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-windows
          path: |
            **/bin/Release/**
          if-no-files-found: ignore

  validate-pwa:
    name: PWA (cross-platform web app)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate manifest
        run: |
          python3 -c "import json; json.load(open('web/manifest.webmanifest'))"
          echo "manifest.webmanifest is valid JSON"

      - name: Validate HTML/JS exist
        run: |
          test -f web/index.html
          test -f web/app.js
          test -f web/sw.js
          test -f web/icons/icon-192.png
          test -f web/icons/icon-512.png
          echo "PWA shell present"

      - name: Upload web bundle
        uses: actions/upload-artifact@v4
        with:
          name: pwa-web
          path: web/
