name: Release (multi-platform)

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag or ref to release (e.g. vV5.1.3). Leave empty to use the triggering ref.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  bundle:
    name: Build per-platform bundles
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - id: ver
        shell: bash
        run: |
          TAG="${{ github.event.inputs.ref || github.ref_name }}"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build all platform bundles
        run: bash scripts/build-releases.sh "${{ steps.ver.outputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: release-bundles
          path: dist/

  build-windows-native:
    name: Build Windows native .exe
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
      - uses: microsoft/setup-msbuild@v2
      - uses: NuGet/setup-nuget@v2
      - run: nuget restore "Excel Recovery.sln"
        continue-on-error: true
      - run: msbuild "Excel Recovery.sln" /p:Configuration=Release /p:Platform="Any CPU" /m
        continue-on-error: true
      - name: Stage native build
        shell: bash
        run: |
          mkdir -p windows-native
          if [ -d "Excel Recovery/bin/Release" ]; then
            cp -r "Excel Recovery/bin/Release/." windows-native/ || true
          fi
      - name: Sign Windows binaries (Azure Trusted Signing)
        if: hashFiles('windows-native/**/*.exe', 'windows-native/**/*.dll', 'windows-native/**/*.msi') != ''
        uses: azure/trusted-signing-action@v0.5.1
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_TRUSTED_SIGNING_PROFILE }}
          files-folder: windows-native
          files-folder-filter: exe,msi,dll
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Package native build
        shell: bash
        run: |
          if [ -d "windows-native" ] && [ "$(ls -A windows-native 2>/dev/null)" ]; then
            cd windows-native && 7z a "../corruptexcelrec-windows-native.zip" .
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-native
          path: corruptexcelrec-windows-native.zip
          if-no-files-found: ignore

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [bundle, build-windows-native]
    if: always() && needs.bundle.result == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
      - uses: actions/download-artifact@v4
        with: { name: release-bundles, path: dist/ }
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { name: windows-native, path: dist/ }
      - name: Create / update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.bundle.outputs.tag }}"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "$TAG" --notes-file dist/RELEASE_NOTES.md
          gh release upload "$TAG" dist/*.zip dist/*.tar.gz dist/*.AppImage 2>/dev/null --clobber || true
