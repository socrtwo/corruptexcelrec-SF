name: Release (multi-platform)

# How to release:
#   - Easiest:  Actions -> "Release (multi-platform)" -> Run workflow, enter a
#               version like `v5.1.4`. The workflow builds every platform bundle
#               and attaches all of them to a fresh GitHub Release (creating the
#               tag on the current ref if it does not exist).
#   - Or:       push a `v*` tag (`git tag v5.1.4 && git push origin v5.1.4`).
#
# NOTE: always tag with a single leading "v" (v5.1.4), NOT "vV5.1.4". The build
# script normalizes the version regardless, but a clean tag keeps the release
# page tidy.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag (e.g. v5.1.4). Created on the current ref if missing.'
        required: true
        default: 'v5.1.4'
      prerelease:
        description: 'Mark as pre-release?'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  bundle:
    name: Build per-platform bundles
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: ver
        name: Resolve version
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          # Normalize: strip every leading v/V so VERSION is just the number.
          VERSION="$TAG"
          while [ "${VERSION#[vV]}" != "$VERSION" ]; do VERSION="${VERSION#[vV]}"; done
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved version=${VERSION} tag=v${VERSION}"

      - name: Build all platform bundles
        run: bash scripts/build-releases.sh "${{ steps.ver.outputs.version }}"

      - name: List built artifacts
        run: ls -la dist/

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-bundles
          path: dist/
          if-no-files-found: error

  build-windows-native:
    name: Build Windows native .exe (best effort)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - uses: NuGet/setup-nuget@v2
      - run: nuget restore "Excel Recovery.sln"
        continue-on-error: true
      - run: msbuild "Excel Recovery.sln" /p:Configuration=Release /p:Platform="Any CPU" /m
        continue-on-error: true
      - name: Package native build
        shell: bash
        run: |
          mkdir -p windows-native
          if [ -d "Excel Recovery/bin/Release" ]; then
            cp -r "Excel Recovery/bin/Release/." windows-native/ || true
          fi
          if [ -d "windows-native" ] && [ "$(ls -A windows-native 2>/dev/null)" ]; then
            cd windows-native && 7z a "../corruptexcelrec-windows-native.zip" .
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-native
          path: corruptexcelrec-windows-native.zip
          if-no-files-found: ignore

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [bundle, build-windows-native]
    # Publish as long as the cross-platform bundles built. The native Windows
    # build is best-effort and must not block the release.
    if: always() && needs.bundle.result == 'success'
    steps:
      - uses: actions/checkout@v4

      - name: Download cross-platform bundles
        uses: actions/download-artifact@v4
        with:
          name: release-bundles
          path: dist/

      - name: Download Windows native build (optional)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: windows-native
          path: dist/

      - name: Show what will be published
        run: ls -la dist/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.bundle.outputs.tag }}
          name: S2 Recovery Tools for Microsoft Excel ${{ needs.bundle.outputs.tag }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.prerelease == 'true' }}
          body_path: dist/RELEASE_NOTES.md
          # Every path below is written by scripts/build-releases.sh for the
          # resolved version. fail_on_unmatched_files makes the run FAIL loudly
          # if any required bundle is missing, instead of silently publishing a
          # release with zero assets (the bug that produced an empty vV5.1.3).
          files: |
            dist/corruptexcelrec-windows-v${{ needs.bundle.outputs.version }}.zip
            dist/corruptexcelrec-macos-v${{ needs.bundle.outputs.version }}.zip
            dist/corruptexcelrec-linux-v${{ needs.bundle.outputs.version }}.tar.gz
            dist/corruptexcelrec-chromeos-v${{ needs.bundle.outputs.version }}.zip
            dist/corruptexcelrec-android-v${{ needs.bundle.outputs.version }}.zip
            dist/corruptexcelrec-ios-v${{ needs.bundle.outputs.version }}.zip
            dist/corruptexcelrec-web-v${{ needs.bundle.outputs.version }}.zip
            dist/SHA256SUMS
          fail_on_unmatched_files: true

      - name: Attach Windows native build if present
        # Optional asset, only uploaded when the windows-latest job produced it.
        # Kept separate so a missing native build never fails the release.
        if: hashFiles('dist/corruptexcelrec-windows-native.zip') != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.bundle.outputs.tag }}
          files: dist/corruptexcelrec-windows-native.zip
          fail_on_unmatched_files: true
